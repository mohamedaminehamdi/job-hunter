# There is no package here, and no `[project]` table, because nothing in this
# repo is installed with pip.
#
# The skills are copied, not packaged: each carries `lib/jobhunt.py`, which is
# standard library only and runs on the Python 3.9 macOS ships. `pip install .`
# would have nothing to build - it tried, once, and setuptools quite correctly
# refused on finding `core` and `plugins` sitting next to each other.
#
# What is left is configuration for the tools a *contributor* runs. Their
# versions are in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The per-skill copies are generated by tools/sync.py from core/jobhunt.py.
# Linting them would report the same finding eleven times and tempt an edit in
# the wrong place - the source is the only file to fix.
extend-exclude = ["plugins/*/skills/*/lib"]
# 3.9, because `core/jobhunt.py` has to run on the Python macOS ships. With
# py311 here, UP017 rewrites `timezone.utc` to `datetime.UTC` and every skill
# stops importing on a stock Mac.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
