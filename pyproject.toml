# There is nothing to build here and nothing to install.
#
# The skills are copied, not packaged: each one carries `lib/jobhunt.py`, which
# is standard library only and runs on Python 3.9 - the version macOS ships and
# the version a friend on a fresh laptop actually has. This file exists for the
# tools a *contributor* needs, and for nothing a user does.

[project]
name = "jobhunt"
version = "1.0.0"
description = "Job application skills for any coding agent. No API key, nothing to install."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Mohamed Amine Hamdi" }]
keywords = ["cv", "resume", "cover-letter", "job-search", "skill", "agent"]

# None. That is the whole point - see the comment above.
dependencies = []

[project.optional-dependencies]
# pyyaml is here as an *oracle*, not a dependency: the hand-written reader in
# core/jobhunt.py is tested by comparing it against pyyaml on real files, which
# is how ten bugs in it were found. Nothing shipped imports it.
dev = ["pytest>=8.3", "ruff>=0.6", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/mohamedaminehamdi/job-hunter"
Issues = "https://github.com/mohamedaminehamdi/job-hunter/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The per-skill copies are generated by tools/sync.py from core/jobhunt.py.
# Linting them would report the same finding eleven times and tempt an edit in
# the wrong place - the source is the only file to fix.
extend-exclude = ["plugins/*/skills/*/lib"]
# 3.9, because `core/jobhunt.py` has to run on the Python macOS ships. With
# py311 here, UP017 rewrites `timezone.utc` to `datetime.UTC` and every skill
# stops importing on a stock Mac.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
