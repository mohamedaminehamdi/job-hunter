[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter"
version = "0.1.0"
description = "Prepare one job application end to end from a job URL, inside Claude Code."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mohamed Amine Hamdi" }]
keywords = ["cv", "resume", "cover-letter", "job-search", "claude-code", "skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Claude Code is the model, so there is no provider library here and no key to
# get. What is left is the deterministic half: validation, the invention guard,
# reading a CV, fetching a page, and rendering a PDF.
dependencies = [
  "pydantic>=2.7",             # every model, and the validation that salvages bad input
  "pyyaml>=6.0",               # the profile and everything a run writes
  "jinja2>=3.1",               # CV and letter templates
  "playwright>=1.47",          # HTML -> PDF, and job-page fetching
  "pypdf>=5.0",                # reading a CV
  "python-docx>=1.1",          # reading a CV
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mohamedaminehamdi/job-hunter"
Issues = "https://github.com/mohamedaminehamdi/job-hunter/issues"

[tool.hatch.build.targets.wheel]
packages = ["job_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The per-skill copies are generated by tools/sync.py from core/jobhunt.py.
# Linting them would report the same finding eleven times and tempt an
# edit in the wrong place - the source is the only file to fix.
extend-exclude = ["plugins/*/skills/*/lib"]
# 3.9, because `core/jobhunt.py` has to run on the Python macOS ships.
# With py311 here, UP017 rewrites `timezone.utc` to `datetime.UTC` and
# every skill stops importing on a stock Mac.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
