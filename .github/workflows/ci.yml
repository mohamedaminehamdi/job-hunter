name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml. Development happens on
        # 3.12, so without this matrix the floor is a claim nobody checks.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Into the venv setup-uv already made, not --system: the runner's
      # interpreters are externally managed and uv refuses to write to them.
      # Putting it on PATH means the later steps call ruff, pytest and
      # playwright without a prefix.
      - name: Install the project
        run: |
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      # The renderer and the job fetcher drive a real browser, so the tests that
      # cover them need one. Cached because it is a ~150MB download.
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  package:
    # A wheel that builds is not the same as a wheel that runs: the Jinja
    # templates are package data, and an editable install hides it when they
    # are missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Install the wheel somewhere with no source tree
        run: |
          mkdir -p /tmp/clean
          uv venv --python 3.12 /tmp/clean/.venv
          uv pip install --python /tmp/clean/.venv "$GITHUB_WORKSPACE"/dist/*.whl

      # Compared against the source tree rather than a hardcoded count, so
      # adding a template is not a CI failure - only losing one is.
      - name: Every template must have shipped
        run: |
          cd /tmp/clean
          SOURCE="$GITHUB_WORKSPACE/src/job_hunter" ./.venv/bin/python - <<'PY'
          import os
          from importlib.resources import files
          from pathlib import Path

          source = Path(os.environ["SOURCE"])
          missing = []
          for directory in sorted(source.glob("*/templates")):
              package = f"job_hunter.{directory.parent.name}"
              want = {p.name for p in directory.iterdir()
                      if p.name.endswith((".j2", ".html"))}
              shipped = {p.name for p in files(package).joinpath("templates").iterdir()}
              print(f"{package}: {len(want & shipped)}/{len(want)} shipped")
              missing += [f"{package}/{name}" for name in sorted(want - shipped)]
          assert not missing, f"these templates did not ship: {missing}"
          PY

      - name: The console script must run
        run: JOB_HUNTER_HOME=/tmp/clean/home /tmp/clean/.venv/bin/job-hunter --json jobs
