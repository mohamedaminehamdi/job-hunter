name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml. Development happens on
        # 3.12, so without this matrix the floor is a claim nobody checks.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Into the venv setup-uv already made, not --system: the runner's
      # interpreters are externally managed and uv refuses to write to them.
      - name: Install the project
        run: |
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      # The renderer and the job fetcher drive a real browser, so the tests that
      # cover them need one. Cached because it is a ~150MB download.
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Lint
        run: ruff check job_hunter tests

      - name: Test
        run: pytest -q

  private:
    # Nobody's CV, profile or generated documents may ever be tracked. The
    # pre-commit hook is the first line and only works for people who ran the
    # git config; this is the line that works for everyone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nothing private is tracked
        run: |
          tracked=$(git ls-files jobhunt cv runs profile.yaml \
                    | grep -vE '^cv/README\.md$|^runs/\.gitkeep$' || true)
          if [ -n "$tracked" ]; then
            echo "these belong to a person, not to this repo:"
            printf '  %s\n' $tracked
            exit 1
          fi
          echo "clean"
