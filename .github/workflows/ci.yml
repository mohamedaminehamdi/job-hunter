name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is the floor, and it is the one that matters: it is what macOS
        # ships and what a friend on a fresh laptop has. Developing on 3.12
        # and claiming 3.9 without checking is how `datetime.UTC` got in.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pytest, ruff and pyyaml. Nothing that ships needs any of them - pyyaml
      # is the oracle the hand-written YAML reader is tested against.
      - name: Install the contributor tools
        run: python -m pip install --quiet ".[dev]"

      # Chrome renders the PDFs and loads job pages. Both runners already have
      # a Chromium-family browser, which is the point: users install nothing.
      - name: Point at the browser that is already here
        shell: bash
        run: |
          for candidate in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "JOBHUNT_BROWSER=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "no browser on this runner; the PDF tests will skip"

      - name: Test
        run: pytest -q

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install --quiet ".[dev]"

      - name: Lint
        run: ruff check core plugins tools tests

      # Each of these regenerates something checked into the repo. A stale
      # copy is the failure mode that duplication invites, so it fails the
      # build rather than waiting to be noticed.
      - name: The library copies match core/jobhunt.py
        run: python tools/sync.py --check

      - name: The download archives match the skills
        run: python tools/build_archives.py --check

      - name: The site matches the skills
        run: python tools/build_site.py --check

      - name: The installer is clean shell
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          shellcheck -s sh install.sh
          shellcheck -s dash install.sh
          shellcheck -s bash install.sh

  private:
    # Nobody's CV, profile or generated documents may ever be tracked. The
    # pre-commit hook is the first line and only works for people who ran the
    # git config; this is the line that works for everyone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nothing private is tracked
        run: |
          tracked=$(git ls-files jobhunt cv runs profile.yaml)
          if [ -n "$tracked" ]; then
            echo "these belong to a person, not to this repo:"
            printf '%s\n' "$tracked" | sed 's/^/  /'
            exit 1
          fi
          echo "clean"
